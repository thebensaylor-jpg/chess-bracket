<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Club Tournament · Eisenhower</title>
<meta name="description" content="Double-elimination chess tournament bracket with live view">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23BF1919'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#BF1919; --red-hi:#e0322b; --red-deep:#6e0d0d; --ink:#0b0809; --night:#120c0d;
  --cream:#f3e9d6; --paper:#efe2c8; --amber:#ffb347; --amber-soft:#ffcf7a; --glow:rgba(255,170,70,.55);
  --line:rgba(243,233,214,.55); --dim:#d2c6b1; --dim2:#b9ad9a; --amber-text:#ffc970; --red-text:#ff8f80;
  --fh:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --fb:"Josefin Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--fb);font-size:18px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;
  background:
   radial-gradient(1200px 600px at 80% -10%, rgba(191,25,25,.18), transparent 60%),
   radial-gradient(900px 500px at 0% 110%, rgba(191,25,25,.12), transparent 60%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95  0 0 0 0 .9  0 0 0 0 .8  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
   var(--ink);
}
button,input,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}

/* ---------- Storybook hero ---------- */
.hero{position:relative;height:min(52vh,520px);min-height:300px;overflow:hidden;border-bottom:2px solid var(--red-deep)}
.hero .art{position:absolute;inset:0;background:var(--hero) center 62%/cover no-repeat;filter:saturate(1.05) contrast(1.05);transform:scale(1.04);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.09) translateY(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,9,.15) 0%,rgba(11,8,9,.05) 40%,rgba(11,8,9,.75) 85%,var(--ink) 100%)}
body.compact .hero{height:210px;min-height:210px}
body.compact .hero .art{background-position:center 58%}
.plaque{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-52%);text-align:center;
  background:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
   radial-gradient(ellipse at center,#f8efdc 0%,#eadbbd 80%,#d9c59f 100%);
  color:var(--ink);padding:18px 38px 14px;border-radius:26px 34px 22px 30px/30px 22px 34px 26px;
  box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--red),0 18px 50px rgba(0,0,0,.6);max-width:92vw}
.plaque img{display:block;width:min(360px,62vw);height:auto;margin:0 auto}
.plaque h1{font-family:var(--fh);font-weight:400;font-size:clamp(28px,3.4vw,46px);margin:2px 0 0;letter-spacing:.5px;line-height:1.05}
.plaque .sub{font-family:var(--fh);font-style:italic;font-size:19px;color:#5a2a22;margin-top:2px}
body.compact .plaque{top:56%;padding:8px 26px 8px;display:flex;align-items:center;gap:18px}
body.compact .plaque img{width:190px}
body.compact .plaque h1{font-size:30px;text-align:left}
body.compact .plaque .sub{text-align:left;font-size:16px}

/* ---------- flowing line ornaments ---------- */
.flourish{display:block;width:min(760px,90%);height:46px;margin:6px auto 0;overflow:visible}
.flourish path{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:ink 2.6s ease-out forwards}
.flourish path.cream{stroke:var(--line);stroke-width:1.2;animation-delay:.4s}
@keyframes ink{to{stroke-dashoffset:0}}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 22px;background:rgba(11,8,9,.88);backdrop-filter:blur(6px);border-bottom:1px solid rgba(191,25,25,.45)}
.bar .left{display:flex;align-items:center;gap:14px;font-family:var(--fh);font-size:22px}
.bar .right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border:2px solid var(--cream);background:transparent;color:var(--cream);padding:9px 18px;font-weight:700;letter-spacing:.4px;
  border-radius:14px 18px 12px 16px/16px 12px 18px 14px;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 3px rgba(191,25,25,.35)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-hi)}
.btn.ghost{border-color:rgba(243,233,214,.35);font-weight:600}
.btn.big{font-size:24px;padding:14px 34px}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--fb);font-weight:700;font-size:15px;letter-spacing:2px;color:#fff;background:var(--red);padding:5px 12px 4px;border-radius:999px}
.live i{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.live.off{background:#444}.live.off i{animation:none;opacity:.5}
@keyframes pulse{50%{opacity:.25}}
.sync{font-size:14px;opacity:.75}

/* ---------- Setup ---------- */
main{max-width:1180px;margin:0 auto;padding:10px 22px 80px}
body.compact main{max-width:1800px}
.panel{position:relative;background:rgba(18,12,13,.86);border:2px solid rgba(243,233,214,.22);border-radius:28px 34px 26px 32px/32px 26px 34px 28px;padding:26px 30px;margin:22px 0;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.panel h2{font-family:var(--fh);font-weight:400;font-size:34px;margin:0 0 6px;display:flex;align-items:center;gap:12px}
.panel h2 .flame{height:42px}
.hint{opacity:.75;font-size:16px;margin:0 0 14px;line-height:1.45}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
label.f{display:block;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;margin-bottom:6px}
input.t,textarea.t{width:100%;background:#0b0809;color:var(--cream);border:2px solid rgba(243,233,214,.28);border-radius:12px;padding:12px 14px;font-size:20px;outline:none;transition:border-color .2s,box-shadow .2s}
input.t:focus,textarea.t:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(191,25,25,.25)}
textarea.t{min-height:250px;resize:vertical;line-height:1.5}
.tabs{display:flex;gap:8px;margin:6px 0 16px}
.tab{cursor:pointer;padding:10px 18px;border-radius:14px 14px 0 0;border:2px solid rgba(243,233,214,.25);border-bottom-color:transparent;background:transparent;color:var(--cream);font-weight:700;opacity:.65}
.tab.on{opacity:1;border-color:var(--red);background:rgba(191,25,25,.14)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pairrow{display:grid;grid-template-columns:64px 1fr 54px 1fr 48px;gap:10px;align-items:center;animation:rise .35s ease-out}
.pairrow .num{font-family:var(--fh);font-size:22px;text-align:center;color:var(--amber-soft)}
.pairrow .vs{text-align:center;font-family:var(--fh);font-style:italic;color:var(--red-hi);font-size:22px}
.pairrow .x{cursor:pointer;background:none;border:2px solid rgba(243,233,214,.25);color:var(--cream);border-radius:50%;width:42px;height:42px;font-size:20px;line-height:1}
.pairrow .x:hover{border-color:var(--red);color:var(--red-hi)}
.summary{margin-top:16px;font-size:19px;padding:12px 16px;border-left:4px solid var(--red);background:rgba(191,25,25,.08);border-radius:0 12px 12px 0}
.summary.err{border-color:#ff7b5c;color:#ffd0c4}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
.shufflebox{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Bracket ---------- */
.section{margin:26px 0 8px}
.section h2{font-family:var(--fh);font-weight:400;font-size:38px;margin:0;display:flex;align-items:center;gap:14px}
.section h2 .piece{font-size:44px;color:var(--amber-soft);text-shadow:0 0 18px var(--glow)}
.section .lead{opacity:.8;font-size:19px;margin:2px 0 6px 2px;font-style:italic;font-family:var(--fh)}
.scroller{position:relative;overflow-x:auto;overflow-y:visible;padding:8px 4px 22px;scrollbar-color:var(--red) transparent}
.cols{position:relative;display:flex;gap:60px;align-items:stretch;min-width:min-content;padding:6px 10px}
.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.wires path{fill:none;stroke-linecap:round}
.wires .w{stroke:rgba(243,233,214,.55);stroke-width:2}
.wires .w2{stroke:rgba(243,233,214,.18);stroke-width:1}
.wires .l{stroke:rgba(224,50,43,.75);stroke-width:2}
.wires .l2{stroke:rgba(224,50,43,.25);stroke-width:1}
.wires .new{stroke-dasharray:900;stroke-dashoffset:900;animation:ink 1.1s ease-out forwards}
.col{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-around;gap:18px;width:272px;flex:0 0 272px}
.col h3{font-family:var(--fh);font-weight:400;font-size:24px;margin:0 0 4px;text-align:center;color:var(--amber-soft);letter-spacing:.3px;white-space:nowrap}
.col h3 small{display:block;white-space:normal;font-family:var(--fb);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cream);opacity:.55;margin-top:2px}
.col.ghost{opacity:.6;justify-content:flex-start}
.col.ghost .ghostcard{margin-top:40px}
.ghostcard{border:2px dashed rgba(243,233,214,.25);border-radius:60px 60px 18px 18px;padding:28px 18px;text-align:center;font-family:var(--fh);font-style:italic;font-size:18px;color:rgba(243,233,214,.7)}

/* match card = a little lit window */
.match{position:relative;background:linear-gradient(180deg,#1d1314 0%,#140d0e 100%);border:2px solid rgba(243,233,214,.45);
  border-radius:70px 70px 16px 16px/44px 44px 16px 16px;padding:22px 12px 10px;box-shadow:inset 0 0 0 4px #0b0809,inset 0 0 0 5px rgba(191,25,25,.35),0 10px 26px rgba(0,0,0,.45);
  transition:box-shadow .5s,border-color .5s,opacity .5s}
.match.appear{animation:windowOn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes windowOn{0%{opacity:0;transform:translateY(16px) scale(.96);filter:brightness(.3)}60%{filter:brightness(1.35)}100%{opacity:1;transform:none;filter:none}}
.match .tag{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75}
.match.ready{border-color:var(--amber);box-shadow:inset 0 0 0 4px #0b0809,inset 0 0 26px rgba(255,170,70,.28),0 0 22px rgba(255,170,70,.35),0 10px 26px rgba(0,0,0,.45);animation:flicker 3.2s ease-in-out infinite}
.match.ready.appear{animation:windowOn .7s cubic-bezier(.2,.8,.2,1),flicker 3.2s ease-in-out .7s infinite}
@keyframes flicker{50%{box-shadow:inset 0 0 0 4px #0b0809,inset 0 0 34px rgba(255,170,70,.38),0 0 30px rgba(255,170,70,.5),0 10px 26px rgba(0,0,0,.45)}}
.match.done{border-color:rgba(243,233,214,.3)}
.match.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,200,120,.9)}100%{box-shadow:0 0 0 22px rgba(255,200,120,0)}}
.match .vsline{height:0;border-top:1px dashed rgba(243,233,214,.25);margin:3px 8px;position:relative}
.match .vsline span{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:#180f10;padding:0 8px;font-family:var(--fh);font-style:italic;color:var(--red-hi);font-size:16px}
.p{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--cream);text-align:left;padding:9px 10px;border-radius:10px;font-size:21px;font-weight:600;line-height:1.15;transition:background .25s,color .25s,opacity .25s}
.p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .from{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--red-hi);opacity:.9}
.p .ic{width:26px;text-align:center;font-size:22px;opacity:.5}
.admin .match.ready .p{cursor:pointer}
.admin .match.ready .p:hover{background:rgba(255,179,71,.18);box-shadow:inset 0 0 0 2px var(--amber)}
.p.win{background:linear-gradient(90deg,rgba(255,179,71,.95),rgba(255,207,122,.85));color:#1a0b05;text-shadow:none}
.p.win .ic{opacity:1}
.p.out{opacity:.42;text-decoration:line-through;text-decoration-color:var(--red-hi);text-decoration-thickness:2px}
.match.bye{border-style:dashed;border-radius:18px;padding:12px 12px 10px}
.match.bye .byenote{text-align:center;font-family:var(--fh);font-style:italic;opacity:.7;font-size:16px}
.match.pgame{border-color:var(--red)}

/* finals row */
.finals{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.finals .col{flex:0 0 330px;width:330px}
.finals .match .p{font-size:24px}

/* ---------- Standings ---------- */
.standings{text-align:center}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:30px 0 10px;flex-wrap:wrap}
.step{width:250px;display:flex;flex-direction:column;align-items:center;animation:rise .9s ease-out both}
.step .pc{font-size:76px;line-height:1;color:var(--amber-soft);text-shadow:0 0 26px var(--glow)}
.step .who{font-size:30px;font-weight:700;margin:8px 0 10px;min-height:38px;word-break:break-word}
.step .block{width:100%;background:linear-gradient(180deg,#24181a,#130c0d);border:2px solid rgba(243,233,214,.5);border-bottom:none;border-radius:50px 50px 0 0/30px 30px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-family:var(--fh);font-size:46px;position:relative;overflow:hidden}
.step .block::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(rgba(243,233,214,.05) 0 25%,transparent 0 50%) 0 0/36px 36px}
.step.s1 .block{height:210px;border-color:var(--amber);box-shadow:0 0 40px rgba(255,170,70,.35)}
.step.s2 .block{height:150px}
.step.s3 .block{height:110px}
.step.s1{animation-delay:.5s}.step.s2{animation-delay:.2s}.step.s3{animation-delay:.8s}
.step.s1 .who{font-size:38px;color:var(--amber-soft)}
.ranks{max-width:760px;margin:6px auto 0;display:flex;flex-direction:column;gap:10px}
.rank{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px;padding:12px 20px;background:rgba(18,12,13,.8);border:1px solid rgba(243,233,214,.2);border-radius:16px;text-align:left;font-size:24px;animation:rise .6s ease-out both}
.rank .pl{font-family:var(--fh);font-size:30px;color:var(--amber-soft)}
.rank.minor{font-size:19px;padding:8px 20px}.rank.minor .pl{font-size:22px;color:var(--cream);opacity:.8}
.rank .note{display:block;font-size:14px;opacity:.65;font-style:italic;font-family:var(--fh)}
.ready-strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 0;font-size:17px}
.chip{cursor:pointer;border:1px solid var(--amber);color:var(--amber-soft);background:rgba(255,179,71,.08);padding:6px 12px;border-radius:999px;font-weight:600}
.banner{margin:18px 0 0;padding:14px 20px;border-radius:16px;background:rgba(191,25,25,.16);border:1px solid rgba(191,25,25,.6);font-size:19px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,3,.82);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{background:#140d0e;border:2px solid var(--red);border-radius:28px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:28px 34px;position:relative}
.modal h2{font-family:var(--fh);font-weight:400;font-size:36px;margin:0 0 10px}
.modal .close{position:absolute;right:16px;top:12px}
.qr{background:#fff;border-radius:18px;padding:10px;width:min(360px,70vw);margin:10px auto}
.qr svg{display:block;width:100%;height:auto}
.linkbox{font-size:18px;word-break:break-all;background:#0b0809;border:1px dashed var(--amber);padding:12px;border-radius:12px;margin:10px 0}
.howto li{margin:8px 0;line-height:1.45}
.foot{text-align:center;opacity:.45;font-size:14px;margin:40px 0 20px;font-family:var(--fh);font-style:italic}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:12px 22px;border-radius:14px;font-weight:700;z-index:80;animation:rise .3s}
@media (max-width:760px){
  .row2,.shufflebox{grid-template-columns:1fr}
  .pairrow{grid-template-columns:40px 1fr 30px 1fr 42px;gap:6px}
  .pairrow .vs{font-size:16px}
  body.compact .plaque{display:block;text-align:center} body.compact .plaque h1,body.compact .plaque .sub{text-align:center}
  .col{width:250px;flex-basis:250px}
}
/* ---------- Board mode: the whole bracket always fits on one screen ---------- */
body.board .hero,body.board .flourish{display:none}
body.board{overflow:hidden}
body.board main{max-width:none;padding:0;margin:0}
body.board .bar{padding:6px 14px;flex-wrap:nowrap;gap:8px}
body.board .bar .left{font-size:20px;gap:12px;min-width:0;white-space:nowrap;overflow:hidden}
body.board .bar .left .ttl{overflow:hidden;text-overflow:ellipsis}
body.board .bar .right{flex-wrap:nowrap;gap:8px}
body.board .bar .btn{padding:6px 13px;font-size:15px}
.barlogo{height:30px;width:auto;flex:0 0 auto}
.bar .status{font-family:var(--fb);font-size:15px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.bar .status b{color:var(--amber-soft)}
#stage{position:relative;overflow:hidden;width:100%}
#stage.scroll{overflow:auto}
#stage::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--hero) center 60%/cover no-repeat;opacity:.10;filter:saturate(.8);pointer-events:none}
#sizer{position:relative}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
#board .wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#board .wires path{fill:none;stroke-linecap:round}
#board .wires .w{stroke:rgba(243,233,214,.7);stroke-width:2.2}
#board .wires .w2{stroke:rgba(243,233,214,.2);stroke-width:1.2}
#board .wires .e{stroke:rgba(224,50,43,.9);stroke-width:2.2}
#board .wires .e2{stroke:rgba(224,50,43,.3);stroke-width:1.2}
#board .wires .pend{stroke:rgba(243,233,214,.16);stroke-width:1.4;stroke-dasharray:4 5}
#board .wires .new{stroke-dasharray:900;stroke-dashoffset:900;animation:ink 1.1s ease-out forwards}
#board .btitle{position:absolute;font-family:var(--fh);font-size:24px;line-height:28px;white-space:nowrap;display:flex;align-items:baseline;gap:9px;color:var(--cream)}
#board .btitle .piece{font-size:26px;color:var(--amber-soft);text-shadow:0 0 14px var(--glow)}
#board .btitle small{font-family:var(--fh);font-style:italic;font-size:15px;opacity:.6;margin-left:4px}
#board .clabel,#board .flabel{position:absolute;text-align:center;font-family:var(--fb);font-size:12.5px;line-height:16px;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber-soft);opacity:.85;white-space:nowrap;overflow:hidden}
#board .flabel{text-align:left;padding-left:6px;color:var(--cream);opacity:.75;letter-spacing:1.2px}
#board .flabel i{font-family:var(--fh);text-transform:none;letter-spacing:0;font-size:13px;opacity:.75}
#board .match{position:absolute;padding:3px 4px;border-radius:22px 22px 9px 9px/14px 14px 9px 9px;border:1.6px solid rgba(243,233,214,.42);
  background:linear-gradient(180deg,#1f1415 0%,#140d0e 100%);box-shadow:inset 0 0 0 2px #0b0809,inset 0 0 0 3px rgba(191,25,25,.32),0 6px 16px rgba(0,0,0,.45);
  display:flex;flex-direction:column;justify-content:center;transition:box-shadow .5s,border-color .5s,opacity .5s}
#board .match.wait{opacity:.78;border-color:rgba(243,233,214,.22)}
#board .match.done{border-color:rgba(243,233,214,.3)}
#board .match.ready{border-color:var(--amber);box-shadow:inset 0 0 0 2px #0b0809,inset 0 0 16px rgba(255,170,70,.25),0 0 14px rgba(255,170,70,.45),0 6px 16px rgba(0,0,0,.45);animation:flicker2 3.2s ease-in-out infinite}
@keyframes flicker2{50%{box-shadow:inset 0 0 0 2px #0b0809,inset 0 0 22px rgba(255,170,70,.36),0 0 22px rgba(255,170,70,.62),0 6px 16px rgba(0,0,0,.45)}}
#board .match.appear{animation:windowOn .7s cubic-bezier(.2,.8,.2,1) both}
#board .match.ready.appear{animation:windowOn .7s cubic-bezier(.2,.8,.2,1) both,flicker2 3.2s ease-in-out .7s infinite}
#board .match.flash{animation:flash2 .9s ease-out}
@keyframes flash2{0%{box-shadow:0 0 0 0 rgba(255,200,120,.95)}100%{box-shadow:0 0 0 18px rgba(255,200,120,0)}}
#board .match.final{border-color:var(--red);border-width:2px}
#board .match.final.ready{border-color:var(--amber)}
#board .match.pgame{border-color:rgba(224,50,43,.75);border-style:dashed}
#board .match.bye{border-style:dashed;border-radius:12px;opacity:.85}
#board .match.ghost{border:1.6px dashed rgba(243,233,214,.25);background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;font-family:var(--fh);font-style:italic;font-size:13.5px;line-height:1.2;color:rgba(243,233,214,.6);padding:4px 12px}
#board .match .tag{position:absolute;top:-10px;right:14px;font-size:10.5px;line-height:13px;letter-spacing:1px;padding:0 5px;border-radius:6px;background:#0b0809;color:rgba(243,233,214,.7);font-weight:700}
#board .match.ready .tag{color:var(--amber-soft)}
#board .match .div{display:block;height:0;border-top:1px dashed rgba(243,233,214,.22);margin:0 8px}
#board .p{display:flex;align-items:center;gap:6px;height:23px;padding:0 7px;border-radius:7px;font-size:15px;font-weight:700;line-height:23px;border:0;width:100%;background:transparent;color:var(--cream);text-align:left;transition:background .35s,color .35s,opacity .35s}
#board .p .ic{width:16px;flex:0 0 16px;font-size:15px;text-align:center;opacity:.55}
#board .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .p.tbd .nm{font-family:var(--fh);font-style:italic;font-weight:400;font-size:13.5px;opacity:.5}
#board .p.tbd .ic{opacity:.2}
#board .p .drop{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--red-hi);background:rgba(191,25,25,.14);border-radius:5px;padding:0 4px;line-height:15px}
#board .p.win{background:linear-gradient(90deg,rgba(255,179,71,.95),rgba(255,207,122,.85));color:#1a0b05}
#board .p.win .ic{opacity:1}
#board .p.win .drop{color:#7a1010;background:rgba(122,16,16,.12)}
#board .p.out{opacity:.42;text-decoration:line-through;text-decoration-color:var(--red-hi);text-decoration-thickness:2px}
#board .p .byenote{font-family:var(--fh);font-style:italic;font-weight:400;font-size:13px;opacity:.75}
#board .match.bye .p.win{background:transparent;color:var(--cream)}
#board .p.fill{animation:fillIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes fillIn{0%{opacity:0;transform:translateX(-14px);background:rgba(255,179,71,.45)}100%{opacity:1;transform:none}}
.admin #board .match.ready .p{cursor:pointer}
.admin #board .match.ready .p:hover{background:rgba(255,179,71,.2);box-shadow:inset 0 0 0 2px var(--amber)}
#board .champ{position:absolute;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:14px;background:linear-gradient(90deg,rgba(255,179,71,.95),rgba(255,207,122,.85));color:#1a0b05;font-weight:700;font-size:17px;box-shadow:0 0 26px rgba(255,170,70,.55);animation:rise .8s ease-out both}
#board .champ .ic{font-size:24px}
#board .champ .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal.stmodal .box{max-width:980px}
/* ---------- Readability pass (v3): solid, high-contrast colors; no faded text ---------- */
.sync{opacity:1;color:var(--dim);font-size:15px}
.hint{opacity:1;color:var(--dim);font-size:17px}
label.f{opacity:1;color:var(--dim);font-size:15px}
input.t::placeholder,textarea.t::placeholder{color:#a3978a;opacity:1}
.tab{opacity:1;color:var(--dim)}
.tab.on{color:var(--cream)}
.pairrow .vs{color:#f25a4e}
.pairrow .num{color:var(--amber-text)}
.summary small{font-size:16px;color:var(--dim)}
.rank .note{opacity:1;color:var(--dim);font-size:16px;font-family:var(--fb);font-style:normal}
.rank.minor .pl{opacity:1}
.foot{opacity:1;color:var(--dim2);font-size:16px}
.btn:disabled{opacity:1;color:#9a8f82;border-color:#5a4f47}
.bar .status{opacity:1;color:var(--dim)}
.howto li{color:var(--cream)}
#board .btitle small{opacity:1;color:var(--dim);font-family:var(--fb);font-style:normal;font-size:15px}
#board .clabel{opacity:1;color:var(--amber-text);font-size:14px;letter-spacing:1.3px}
#board .flabel{opacity:1;color:var(--cream);font-size:14px;letter-spacing:1px}
#board .flabel i{opacity:1;color:var(--dim);font-family:var(--fb);font-style:normal;font-size:13.5px;text-transform:none}
#board .match.wait{opacity:1}
#board .match.bye{opacity:1}
#board .match .tag{font-size:13.5px;line-height:15px;top:-11px;color:var(--dim);letter-spacing:.8px}
#board .match.ready .tag{color:var(--amber-text)}
#board .p .ic{opacity:1;color:var(--dim2)}
#board .p.win .ic{color:#1a0b05}
#board .p.tbd .nm{opacity:1;color:var(--dim);font-family:var(--fb);font-style:normal;font-weight:600;font-size:14px}
#board .p.tbd .ic{opacity:1;color:#a39789}
#board .p.out{opacity:1;color:var(--dim2);text-decoration-color:rgba(224,50,43,.85)}
#board .p.out .ic{color:#8a7e70}
#board .p .byenote{opacity:1;color:var(--dim);font-family:var(--fb);font-style:normal;font-weight:600;font-size:13.5px}
#board .p .drop{font-size:13px;line-height:16px;color:var(--red-text);background:rgba(191,25,25,.22)}
#board .p.win .drop{color:#5c0b0b;background:rgba(122,16,16,.14)}
#board .match.ghost{color:var(--dim);font-family:var(--fb);font-style:normal;font-weight:600;font-size:14px;line-height:1.25;border-color:rgba(243,233,214,.4);background:#140d0e}
@media (max-width:760px){body.board{overflow:auto} body.board .bar{flex-wrap:wrap} body.board .bar .status{display:none} .barlogo{height:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

    if (S.error) { main.innerHTML = '<div class="panel"><h2>' + esc(S.error) + '</h2></div>'; return; }
    if (!$('#stage')) main.innerHTML = '<div id="stage"><div id="sizer"><div id="boardwrap"></div></div></div>';
    renderBoard();
    if (mode === 'admin') $$('#board .match.ready .p[data-w]').forEach(function (b) { b.onclick = function () { pick(b.dataset.m, +b.dataset.w); }; });
    firstRender = false; lastPicked = null;
    if (S.finished && !standingsAuto) { standingsAuto = true; setTimeout(showStandings, mode === 'viewer' ? 900 : 700); }
    if (!S.finished) standingsAuto = false;
    var open = $('.modal.stmodal'); if (open) { var bx = $('.stbody', open); if (bx && S.finished) bx.innerHTML = standingsHTML(); }
  }
  function renderBoard() {
    var stage = $('#stage'); if (!stage || !S || S.error) return;
    var bar = $('#bar'), narrow = window.innerWidth < 760;
    var availW = stage.clientWidth || window.innerWidth, availH = Math.max(240, window.innerHeight - (bar ? bar.offsetHeight : 0));
    G.CW = cardW();
    var wroot = S.wb[S.wb.length - 1].matches[0];
    var W = { one: makeBlock(wroot, 'W', false), two: makeBlock(wroot, 'W', true) };
    var E = null;
    if (S.eb.length) { var er = S.eb[S.eb.length - 1].matches.filter(function (m) { return !m.bye; })[0]; E = makeBlock(er, 'E', false); }
    var F = makeFinals();
    var A = arrange(W, E, F, availW - 4, availH - 4), pos = A.pos;
    var s = Math.min(A.s, 1.75);
    if (narrow) s = Math.max(s, 0.62); // phones may scroll
    var html = '', svg = '';
    var wb = blockHTML(pos.Wb, G.M + pos.W[0], G.M + pos.W[1], 'Winners Bracket', PIECE_W, 'lose once &rarr; Elimination Bracket');
    html += wb.html; svg += wb.svg;
    if (E) { var eb = blockHTML(E, G.M + pos.E[0], G.M + pos.E[1], 'Elimination Bracket', PIECE_E, 'one loss so far &middot; a second loss and you are out'); html += eb.html; svg += eb.svg; }
    html += finalsHTML(F, G.M + pos.F[0], G.M + pos.F[1]);
    var board = '<div id="board" class="' + (pos.Wb.two ? 'two' : 'one') + '" style="width:' + A.w + 'px;height:' + A.h + 'px;transform:scale(' + s.toFixed(4) + ')">' +
      '<svg class="wires" width="' + A.w + '" height="' + A.h + '" viewBox="0 0 ' + A.w + ' ' + A.h + '">' + svg + '</svg>' + html + '</div>';
    var sw = A.w * s, sh = A.h * s, sizer = $('#sizer');
    stage.style.height = (narrow ? Math.min(availH, sh + 8) : availH) + 'px';
    stage.classList.toggle('scroll', narrow && (sw > availW || sh > availH));
    sizer.style.width = Math.max(sw, narrow ? 0 : availW - 4) + 'px'; sizer.style.height = sh + 'px';
    sizer.style.marginTop = (!narrow && sh < availH) ? Math.floor((availH - sh) / 2) + 'px' : '0px';
    $('#boardwrap').innerHTML = board;
    $('#board').style.left = Math.max(0, (Math.max(sw, availW - 4) - sw) / 2) + 'px';
    if (mode === 'admin') $$('#board .match.ready .p[data-w]').forEach(function (b) { b.onclick = function () { pick(b.dataset.m, +b.dataset.w); }; });
    window.__fit = { scale: s, w: A.w, h: A.h, availW: availW, availH: availH, layout: E ? (pos.F[0] > Math.max(pos.Wb.w, E.w) ? 'stack' : 'other') : 'single' };
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { mctx = null; if (S && $('#stage')) renderBoard(); });
  var rsT = null;
  window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(function () { if (S && $('#stage')) { renderBar(); renderBoard(); } }, 120); });

  function standingsHTML() {
    var byPlace = {}; S.standings.forEach(function (s) { byPlace[s.place] = s; });
    function nm(s) { return s ? s.players.map(function (p) { return esc(nameOf(p)); }).join(' &amp; ') : ''; }
    var h = '<section class="section standings" id="sec-st"><h2 style="justify-content:center"><span class="piece">\u265A</span>Final Standings<span class="piece">\u265A</span></h2>';
    h += '<div class="podium">';
    if (byPlace[2]) h += '<div class="step s2"><div class="pc">\u2655</div><div class="who">' + nm(byPlace[2]) + '</div><div class="block">2nd</div></div>';
    h += '<div class="step s1"><div class="pc">\u2654</div><div class="who">' + nm(byPlace[1]) + '</div><div class="block">1st</div></div>';
    if (byPlace[3]) h += '<div class="step s3"><div class="pc">\u2656</div><div class="who">' + nm(byPlace[3]) + '</div><div class="block">3rd</div></div>';
    h += '</div><div class="ranks">';
    var pieces = { 4: '\u2657' }, delay = 1.1;
    S.standings.forEach(function (s) {
      if (s.place <= 3) return;
      var top = s.place <= 4;
      var lab = (s.tie ? 'T-' : '') + S.ordinal(s.place);
      var note = '';
      if (s.place === 4) note = '<span class="note">went out in the round before the Elimination Final</span>';
      h += '<div class="rank' + (top ? '' : ' minor') + '" style="animation-delay:' + (delay += .12).toFixed(2) + 's"><div class="pl">' + (top && pieces[s.place] ? pieces[s.place] + ' ' : '') + lab + '</div><div>' + nm(s) + note + '</div></div>';
    });
    return h + '</div></section>';
  }
  function showStandings() {
    if (!S || !S.finished) return;
    var old = $('.modal.stmodal'); if (old) old.remove();
    var d = modal('<div class="stbody">' + standingsHTML() + '</div>' + '<div class="actions" style="justify-content:center"><button class="btn red close">Show the bracket</button></div>');
    d.classList.add('stmodal');
  }

  function pick(id, w) {
    if (!Engine.canPick(S, id, w)) return;
    T.results.push([id, w]); T.seq++; save(LS, T); lastPicked = id;
    renderBracket(); publish();
  }
  function undo() {
    if (!T.results.length) return;
    var r = T.results.pop(); T.seq++; save(LS, T);
    seenWires = {}; standingsAuto = !!(S && S.finished);
    var m = S.byId[r[0]];
    renderBracket(); publish(); toast('Undid: ' + nameOf(r[1]) + ' winning ' + (m ? r[0] + (m.label ? ' (' + m.label + ')' : '') : r[0]));
  }

  /* ---------------- top bar / modals ---------------- */
  var liveOK = {}, syncState = 'idle', lastSync = 0;
  function renderBar() {
    var bar = $('#bar'); if (!T) return;
    var ready = S && S.matches ? S.matches.filter(function (m) { return m.ready; }).length : 0;
    var status = !S || S.error ? '' : S.finished ? '<span class="status">\u2654 Champion: <b>' + esc(nameOf(S.champion)) + '</b></span>' : mode === 'admin' ? '<span class="status">Click the winner&rsquo;s name &middot; <b>' + ready + '</b> game' + (ready === 1 ? '' : 's') + ' ready</span>' : '<span class="status"><b>' + ready + '</b> game' + (ready === 1 ? '' : 's') + ' in play</span>';
    var left = '<img class="barlogo" src="' + LOGO + '" alt="Eisenhower Music"><span class="ttl">' + esc(T.title || 'Chess Tournament') + '</span>' + status;
    var right = '';
    var stBtn = S && S.finished ? '<button class="btn red" id="stbtn">\u2654 Standings</button>' : '';
    if (mode === 'admin') {
      right += '<span class="sync" id="sync"></span>' + stBtn + '<button class="btn red" id="share">&#128225; Share live view</button><button class="btn" id="undo" ' + (T.results.length ? '' : 'disabled') + '>&#8630; Undo</button><button class="btn ghost" id="how">How it works</button><button class="btn ghost" id="newt">New</button>';
    } else {
      right += '<span class="live" id="live"><i></i>LIVE</span>' + stBtn + '<button class="btn ghost" id="how">How it works</button>';
    }
    bar.innerHTML = '<div class="left">' + left + '</div><div class="right">' + right + '</div>';
    if (mode === 'admin') {
      $('#share').onclick = showShare; $('#undo').onclick = undo;
      $('#newt').onclick = function () { if (confirm('Start a NEW tournament? This clears the current bracket (the student names stay in setup so you can reuse them).')) { localStorage.removeItem(LS); T = null; S = null; document.body.classList.remove('board'); renderSetup(); window.scrollTo(0, 0); } };
      updSync();
    } else updLive();
    if ($('#stbtn')) $('#stbtn').onclick = showStandings;
    $('#how').onclick = showHowTo;
  }
  function modal(html) { var d = document.createElement('div'); d.className = 'modal'; d.innerHTML = '<div class="box"><button class="btn ghost close">&times;</button>' + html + '</div>'; d.onclick = function (e) { if (e.target === d || e.target.classList.contains('close')) d.remove(); }; document.body.appendChild(d); return d; }
  function viewerLink() { return location.href.split('#')[0] + '#watch=' + T.topic; }
  function showShare() {
    var link = viewerLink(), qr = '';
    try { qr = QR.toSVG(link, '#140d0e'); } catch (e) { qr = ''; }
    var d = modal('<h2>Watch live</h2><p class="hint">Anyone with this link (or who scans the code) can watch the bracket update in real time. No account needed. It is view-only.</p>' + (qr ? '<div class="qr">' + qr + '</div>' : '') + '<div class="linkbox" id="lk">' + esc(link) + '</div><div class="actions"><button class="btn red" id="cp">Copy link</button><a class="btn ghost" href="' + esc(link) + '" target="_blank" rel="noopener" style="text-decoration:none">Open viewer</a></div>');
    $('#cp', d).onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { toast('Link copied'); }, function () { var r = document.createRange(); r.selectNodeContents($('#lk', d)); var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); toast('Link copied'); });
    };
  }
  function showHowTo() {
    modal('<h2>How double elimination works</h2><ol class="howto">' +
      '<li><b>Everyone starts in the Winners Bracket.</b> Win and you stay there.</li>' +
      '<li><b>Lose once and you drop to the Elimination Bracket.</b> You are still in the tournament. <b>Lose twice and you are out.</b></li>' +
      '<li><b>No waiting for a whole round.</b> Every game is on the board from the start. A game lights up as soon as both of its players are known, so fast players can keep going while slower games finish.</li>' +
      '<li><b>Elimination Bracket rounds take turns.</b> Players already there play each other, then the winners meet students dropping down from the Winners Bracket (the little &darr;W2 tag shows where a student came from). The board is wired to avoid rematches wherever it can.</li>' +
      '<li><b>Byes.</b> When a round has an odd number of players, one student gets a free pass to the next round. No student ever gets more than one bye.</li>' +
      '<li><b>Grand Final.</b> The Winners champion (no losses) plays the Elimination champion (one loss). If the Winners champion wins, it is over. If the Elimination champion wins, both now have one loss, so they play <b>one deciding game</b>.</li>' +
      '<li><b>Places.</b> 1st and 2nd come from the Grand Final. 3rd place went out in the Elimination Final, and 4th in the Elimination round before that. The standings list 1st through 4th.</li></ol>');
  }
  /* ---------------- LIVE SYNC: admin publish ---------------- */
  var pubTimer = null, pubBusy = false, pubPending = false, backoff = 2000;
  function publish() { if (!T) return; pubPending = true; if (!pubTimer) pubTimer = setTimeout(doPublish, 500); }
  function doPublish() {
    pubTimer = null;
    if (!T || !pubPending) return;
    if (pubBusy) { pubTimer = setTimeout(doPublish, 600); return; }
    pubPending = false; pubBusy = true; syncState = 'sending'; updSync();
    var body = payload(), topic = T.topic;
    Promise.all(SERVERS.map(function (s) { return fetch(s + '/' + topic, { method: 'POST', body: body }).then(function (r) { return r.ok; }).catch(function () { return false; }); }))
      .then(function (oks) {
        pubBusy = false;
        if (oks.some(Boolean)) { syncState = 'ok'; lastSync = Date.now(); backoff = 2000; }
        else { syncState = 'err'; pubPending = true; if (!pubTimer) pubTimer = setTimeout(doPublish, backoff); backoff = Math.min(backoff * 2, 30000); }
        updSync();
      });
  }
  function updSync() {
    var el = $('#sync'); if (!el) return;
    el.innerHTML = syncState === 'ok' ? '<span class="live"><i></i>LIVE</span>' : syncState === 'err' ? '&#9888; live view offline &mdash; retrying' : syncState === 'sending' ? 'syncing&hellip;' : '';
  }
  setInterval(function () { if (mode === 'admin' && T && syncState === 'ok' && Date.now() - lastSync > 20 * 60 * 1000) publish(); }, 60000); // refresh cache occasionally

  /* ---------------- LIVE SYNC: viewer ---------------- */
  var curSeq = -1;
  function accept(msg) {
    var o; try { o = decode(msg); } catch (e) { return; }
    if (!o || o.seq <= curSeq) return;
    curSeq = o.seq;
    var restart = !T;
    T = o;
    if (restart) { firstRender = true; seen = {}; seenSlot = {}; }
    renderBracket();
  }
  function updLive() { var el = $('#live'); if (el) el.classList.toggle('off', !Object.keys(liveOK).some(function (k) { return liveOK[k]; })); }
  function poll(s) {
    return fetch(s + '/' + watch + '/json?poll=1&since=latest').then(function (r) { return r.text(); }).then(function (t) {
      t.trim().split('\n').forEach(function (line) { if (!line) return; try { var j = JSON.parse(line); if (j.event === 'message') accept(j.message); } catch (e) { } });
    }).catch(function () { });
  }
  function openES(s) {
    if (!window.EventSource) return;
    var es = new EventSource(s + '/' + watch + '/sse');
    es.onmessage = function (e) { try { var j = JSON.parse(e.data); if (j.event === 'message') accept(j.message); } catch (x) { } };
    es.onopen = function () { liveOK[s] = true; updLive(); poll(s); };
    es.onerror = function () { liveOK[s] = false; updLive(); };
  }
  function startViewer() {
    document.body.classList.add('compact');
    setHero('Chess Club Tournament', 'Live view');
    $('#bar').classList.remove('hidden');
    $('#bar').innerHTML = '<div class="left">Live bracket</div><div class="right"><span class="live off" id="live"><i></i>LIVE</span><button class="btn ghost" id="how">How it works</button></div>';
    $('#how').onclick = showHowTo;
    $('#main').innerHTML = '<div class="panel" style="text-align:center"><h2 style="justify-content:center">Waiting for the bracket&hellip;</h2><p class="hint">This page updates by itself as soon as the teacher records a result. Keep it open.</p></div>';
    SERVERS.forEach(function (s) { poll(s); openES(s); });
    setInterval(function () { if (!Object.keys(liveOK).some(function (k) { return liveOK[k]; })) SERVERS.forEach(poll); }, 20000);
  }

  /* ---------------- boot ---------------- */
  if (mode === 'viewer') startViewer();
  else {
    T = load(LS);
    if (T && T.names && T.pairs && T.results) {
      if (T.v !== 2) { // saved by the first version of this page: keep round-1 results, rebuild the rest
        var before = T.results.length;
        T.results = T.results.filter(function (r) { return Array.isArray(r) && /^W1-/.test(r[0]); });
        T.v = 2; T.seq = (T.seq || 1) + 1; save(LS, T);
        if (before !== T.results.length) setTimeout(function () { toast('Bracket upgraded: round-1 results kept; please re-click later results'); }, 600);
      }
      try { renderBracket(); publish(); } catch (e) { localStorage.removeItem(LS); T = null; S = null; document.body.classList.remove('board'); renderSetup(); }
    }
    else renderSetup();
  }
  window.__app = { get T() { return T; }, get S() { return S; }, pick: pick, undo: undo, accept: accept };
})();

</script>
</body>
